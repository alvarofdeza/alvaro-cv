<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer border -->
  <rect width="32" height="32" fill="#23262B" />
  
  <!-- Floppy Disk Base (Petroleum Teal) -->
  <rect x="2" y="2" width="28" height="28" fill="#204B57" />
  
  <!-- Metal Shutter (Alabaster Cream) -->
  <rect x="7" y="2" width="18" height="12" fill="#FDFCF7" stroke="#23262B" stroke-width="1" />
  <!-- Shutter Slot Window -->
  <rect x="11" y="4" width="4" height="7" fill="#204B57" />
  
  <!-- Paper Label (Alabaster Cream) -->
  <rect x="6" y="16" width="20" height="13" fill="#FDFCF7" stroke="#23262B" stroke-width="1" />
  
  <!-- Red Risograph Accent Stripe on Label -->
  <rect x="8" y="18" width="16" height="3" fill="#C84831" />
  
  <!-- Label Text Lines -->
  <rect x="8" y="23" width="12" height="2" fill="#565A63" />
  <rect x="8" y="26" width="8" height="2" fill="#8A8E98" />
  
  <!-- Corner Cutout Notch -->
  <rect x="27" y="2" width="3" height="3" fill="#23262B" />
</svg>
